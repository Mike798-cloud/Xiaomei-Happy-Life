<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>找不到页面</title>
<meta http-equiv="refresh" content="6;url=index.html">
<style>
  html,body{margin:0;height:100%;background:#0a0811;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       color:#777;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;text-align:center;padding:20px;}
  .big{font-size:40pt;color:#b31b1b;letter-spacing:6px;margin-bottom:18px;font-weight:900;}
  p{line-height:2;font-size:11pt;}
  .small{font-size:9pt;color:#444;margin-top:30px;}
  .cursor{display:inline-block;width:8px;height:16px;background:#777;animation:blink 1s steps(1) infinite;vertical-align:-2px;}
  @keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
  <div class="big">404</div>
  <p>你要找的页面，和小美一起留在 2003 年了……</p>
  <p class="small">6 秒后自动返回快乐家园<span class="cursor"></span></p>
</body>
</html>
